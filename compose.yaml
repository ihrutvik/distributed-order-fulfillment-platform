services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: orders, POSTGRES_USER: orders, POSTGRES_PASSWORD: orders}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U orders"], interval: 3s, timeout: 3s, retries: 10}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports: ["9092:9092"]
  app:
    build: .
    environment: {DATABASE_URL: jdbc:postgresql://postgres:5432/orders, KAFKA_BOOTSTRAP_SERVERS: kafka:9092, OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces, TRACING_SAMPLE_PROBABILITY: 1.0}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      jaeger: {condition: service_started}
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686", "4317:4317", "4318:4318"]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./observability/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [app]
  grafana:
    image: grafana/grafana:12.1.1
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer, GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
  load-test:
    image: grafana/k6:0.54.0
    profiles: [load-test]
    environment: {BASE_URL: http://app:8080, API_KEY: demo-secret}
    volumes: ["./load-tests:/scripts:ro"]
    command: ["run", "/scripts/order-load.js"]
    depends_on: [app]
volumes: {postgres-data: {}}
