name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: "17", cache: maven}
      - run: mvn --batch-mode verify
      - run: docker compose config --quiet
      - name: Validate provisioned Grafana dashboard
        run: python -m json.tool observability/grafana/dashboards/order-fulfillment.json > /dev/null
      - name: Validate k6 load-test syntax
        run: docker run --rm -v "$PWD/load-tests:/scripts:ro" grafana/k6:0.54.0 inspect /scripts/order-load.js
      - name: Validate Kubernetes manifests
        run: docker run --rm -v "$PWD/deploy/kubernetes:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /manifests
      - run: docker build --tag distributed-order-fulfillment-platform:${{ github.sha }} .
      - uses: actions/upload-artifact@v5
        with: {name: application-jar, path: target/*.jar}
