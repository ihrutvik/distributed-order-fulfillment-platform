groups:
  - name: order-platform-slo
    rules:
      - alert: SagaTimeoutBudgetExhausted
        expr: increase(orders_saga_timeouts_total{outcome="exhausted"}[10m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: A fulfillment saga exhausted its retry budget
      - alert: OrderApiServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Order API server error rate is elevated
      - alert: OrderPlatformDown
        expr: up{job="order-platform"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Order platform metrics endpoint is unavailable
